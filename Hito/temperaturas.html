<!DOCTYPE html>
<html>
<head>
    <title>Datos Meteorológicos</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body id="temp">
    <nav class="navbar navbar-expand-lg navbar-light bg-light">
        <a class="navbar-brand" href="#">Manzanares el Real</a>
        <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav">
                <li class="nav-item active">
                    <a class="nav-link" href="index.html">Inicio</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="temperaturas.html">Temperatura</a>
                </li>
            </ul>
            <div class="ms-auto">
                <img id="hora" width="20%">
            </div>
        </div>
    </nav>
    
    <div class="container mt-5">
        <form id="dataSelectionForm">
            <div class="form-group">
                <label for="indexSelect">Buscador de provincias:</label>
                <input type="text" id="searchInput" placeholder="Buscar provincia..." class="form-control" />
                <select class="form-control mt-2" id="indexSelect">
                </select>
            </div>
            <div class="form-group mt-3">
                <label for="citySearchInput">Buscador de ciudades:</label>
                <input type="text" id="citySearchInput" placeholder="Buscar ciudad..." class="form-control" />
            </div>
        </form>
        <table id="weather-table" class="table mt-3">
            <thead>
                <tr>
                    <th>Ciudad</th>
                    <th>Provincia</th>
                    <th>Descripción del Clima</th>
                    <th>Temperatura Máxima (°C)</th>
                    <th>Temperatura Mínima (°C)</th>
                </tr>
            </thead>
            <tbody id="weather-data">
            </tbody>
        </table>
    </div>

    <script src="script/scripts.js"></script>
</body>
</html>

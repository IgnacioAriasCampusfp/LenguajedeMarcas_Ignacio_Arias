<!DOCTYPE html>
<html>
<head>
    <title>Datos Meteorológicos</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body id="body">
    <nav class="navbar navbar-expand-lg navbar-light bg-light">
        <a class="navbar-brand" href="#">Manzanares el Real</a>
        <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav">
                <li class="nav-item active">
                    <a class="nav-link" href="index.html">Inicio</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="temperaturas.html">Temperatura</a>
                </li>
            </ul>
            <div class="ms-auto">
                <img id="hora" width="20%">
            </div>
        </div>
    </nav>
    
    <div class="container mt-5">
        <form id="dataSelectionForm">
            <div class="form-group">
                <label for="provinceSearch">Buscar provincia:</label>
                <input type="text" class="form-control" id="provinceSearch" placeholder="Escribe el nombre de la provincia">
            </div>
            <div class="form-group mt-3">
                <label for="indexSelect">Selecciona una provincia:</label>
                <select class="form-control" id="indexSelect"></select>
            </div>
            <div class="form-group mt-3">
                <label for="municipioSearch">Buscar municipio:</label>
                <input type="text" class="form-control" id="municipioSearch" placeholder="Escribe el nombre del municipio">
            </div>
            <div class="form-group mt-3">
                <label for="municipioSelect">Selecciona un municipio:</label>
                <select class="form-control" id="municipioSelect"></select>
            </div>
        </form>

        <!-- Tabla para mostrar los datos de la provincia -->
        <table id="weather-table" class="table mt-4">
            <thead>
                <tr>
                    <th>Provincia</th>
                    <th>Descripción del Clima</th>
                    <th>Temperatura Máxima (°C)</th>
                    <th>Temperatura Mínima (°C)</th>
                    <th>Código de Provincia</th>
                </tr>
            </thead>
            <tbody id="weather-data"></tbody>
        </table>
        
        <h3 class="mt-5">Datos de los Municipios</h3>
        <table id="municipios-table" class="table">
            <thead>
                <tr>
                    <th>Nombre del Municipio</th>
                    <th>Superficie (km²)</th>
                    <th>Perímetro (km)</th>
                    <th>Población</th>
                </tr>
            </thead>
            <tbody id="municipios-data"></tbody>
        </table>
    </div>

    <script src="script/scripts.js"></script>
</body>
</html>
